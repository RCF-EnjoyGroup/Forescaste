# Enterprise Room Nights Forecasting Engine — configuración central
# ================================================================
# Toda corrida lee esta configuración; cambiar valores NO requiere tocar código.
# Variables de entorno opcionales que sobreescriben estos valores:
#   FORECAST_HORIZON, RETRAIN_FREQUENCY, MIN_HISTORY, RANDOM_SEED

random_seed: 42
log_level: INFO

# Horizonte de forecast (días). Soportado: 30, 60, 90 (ver spec forecasting:
# "Horizonte configurable"; otros valores positivos también se aceptan).
forecast:
  horizon_days: 90
  # Percentiles de la banda de incertidumbre (P10/P50/P90)
  percentiles: [10, 50, 90]

# Política de re-entrenamiento (ver spec monitoring)
retraining:
  frequency: monthly          # daily | weekly | monthly | quarterly | never
  min_history_days: 365       # mínimo de días de histórico para re-entrenar

# Fuentes de datos (las tres fuentes reales exclusivas del motor)
data:
  sources:
    capacity: data/capacity_daily.csv
    demand: data/demand_daily.csv
    pickup: data/pickup_by_lead.csv
  # Nombres de columna candidatos por rol; la detección automática puede
  # identificar el esquema sin que coincidan exactamente (spec data-ingestion).
  column_hints:
    property: [property, property_id, hotel, hotel_id, hotel_code, propiedad, variant]
    date: [date, stay_date, business_date, fecha, day]
    capacity: [capacity, available_rooms, inventory, rooms_available, oficial_inventory]
    demand: [room_nights, rooms_sold, rn, demand, actual_rn, actual]
    pickup: [pickup, pickup_rn, booked_rn, current_rn, on_books, rooms_booked]
    snapshot: [snapshot_date, snap_date, forecast_date, as_of]
    lead: [lead_days, lead, anticipation_days, dias_anticipacion]
  # Alias de propiedad: nombres distintos entre fuentes que designan el MISMO
  # hotel (spec data-ingestion: normalización antes de cruzar fuentes).
  property_aliases:
    "Hotel Royal Corin": CORIN
  # Propiedades CERRADAS: excluidas del motor completo (ingesta → entregables);
  # el manifiesto registra la exclusión. Nombre canónico (post-alias).
  excluded_properties: [LIRAK, LAPAS]
  # Eventos privados OPCIONALES (conciertos, congresos, torneos): CSV con
  # event_name, event_date y property opcional (blank = portafolio). Sin
  # archivo el motor queda idéntico y el manifiesto declara la fuente
  # ausente. Contrato de exportación en README_SISTEMAS.md.
  events_path: data/events.csv

# Curva de pickup (candidato operante): a leads largos el on-the-books cubre
# poco, así que la curva se condiciona por la temporada de la fecha de estancia
# y se entrena solo con la ventana de recencia — el forecast converge al nivel
# estacional del stay, no al promedio anual. A leads cortos (≤ season_min_lead)
# se usa la curva agrupada de la propiedad (más datos por bin, menos ruido).
# Defaults validados con A/B sobre la ventana de verificación 2026-07-09..10-06.
pickup_curve:
  season_conditional: true   # curva por (propiedad, temporada) con fallback
  season_min_lead: 30         # la curva estacional aplica solo a leads ≥ 30
  max_history_days: 1095      # ventana de recencia del fit (3 años)
  min_stays_per_bucket: 30    # menos estancias ⇒ fallback a la curva de propiedad
  holiday_conditional: true   # nivel extra: curva por (propiedad, ventana de feriado)
  min_stays_per_holiday_bucket: 15  # umbral propio: las ventanas de feriado son
                                    # ~9 días (vs meses de una temporada); con el
                                    # umbral de temporadas (30) serían inalcanzables
  # Bordes de bins de lead EXPLÍCITOS (preceden a n_bins). La curva de reservas
  # es cóncava: con bins uniformes de ~9 días el lead 1 y el lead 9 comparten
  # pickup esperado — sobre-pronóstico al cierre (lead 1) y sub-estimación en
  # 3-9, exactamente donde el negocio decide. Densidad mayor a leads cortos;
  # el último borde es catch-all (leads ≥ 90 usan la curva del bin final).
  # A/B verificación (real-20261015-1202 vs 20261014-1520): banda 1-2 bias
  # +1.85% → −0.01%, WMAPE 3.1% → 1.8%; global 12.79% → 12.73%.
  bin_edges: [1, 3, 7, 14, 21, 30, 45, 60, 90]

# Benchmark de selección (folds): ventanas del horizonte operativo completo.
# Con spacing trimestral, n_folds=4 y fold_horizon_days=90 las 4 ventanas
# TESIAN el año anterior al corte (cada estación evaluada, sin solape entre
# folds ni con la ventana de reporte). 30 = barato pero ciego al régimen largo.
benchmark:
  fold_horizon_days: 90
  n_folds: 4

# Calendario de feriados (fuente confiable: librería `holidays`): CR (Semana
# Santa, Anexión, Día de la Madre, Independencia…) + mercados emisores US
# (Thanksgiving, Memorial, Labor Day, 4 de julio). Fechas movibles resueltas
# correctamente; ventanas de viaje ± window_days para el condicionamiento
# de la curva y `is_holiday`/`days_to_nearest_holiday` para los candidatos ML.
holidays:
  countries: [CR, US]
  window_days: 4
